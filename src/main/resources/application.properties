server.port=8080
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/shop;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.flyway.enabled=true
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=7d
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=framework
shop.origin=${PUBLIC_ORIGIN:http://localhost:4200}
shop.whatsapp=${WHATSAPP_NUMBER:221772506666}
shop.uploads=${UPLOADS_PATH:./data/uploads}
shop.seed-demo=${SEED_DEMO:false}
