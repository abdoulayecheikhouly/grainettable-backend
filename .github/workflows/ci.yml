name: Java 21 API — CI/CD
on:
  push: {branches: [main]}
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Deploy tested commit through the restricted SSH command
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          for attempt in 1 2 3 4; do
            set +e
            ssh -o ConnectTimeout=15 -o ConnectionAttempts=2 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/deploy_key deploy-grainettable@187.126.0.25 "$TARGET_SHA"
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then exit 0; fi
            if [ "$status" -ne 255 ]; then exit "$status"; fi
            sleep 10
          done
          exit 255
